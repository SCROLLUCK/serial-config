<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Interface Serial via Web Serial API</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 800px;
        margin: 20px auto;
        padding: 0 16px;
      }
      label {
        display: block;
        margin-top: 12px;
      }
      input,
      textarea,
      select,
      button {
        margin-top: 6px;
        padding: 8px;
        font-size: 14px;
        width: 100%;
        box-sizing: border-box;
      }
      textarea {
        height: 100px;
      }
      #log {
        background: #111;
        color: #eee;
        padding: 8px;
        font-family: monospace;
        height: 200px;
        overflow-y: auto;
        white-space: pre-wrap;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row > * {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <h1>Interface Serial via Web Serial API</h1>

    <div class="row">
      <div>
        <label>Baud rate</label>
        <input id="baudRate" type="number" value="115200" />
      </div>
      <div>
        <label>Tipo de Payload</label>
        <select id="payloadType">
          <option value="text" selected>Texto (UTF-8)</option>
          <option value="hex">Hexadecimal</option>
        </select>
      </div>
    </div>

    <label>Payload</label>
    <textarea id="payload" placeholder="Digite seu payload"></textarea>

    <button id="connectBtn">Conectar (Escolher Porta)</button>
    <button id="sendBtn" disabled>Enviar</button>
    <button id="disconnectBtn" disabled>Desconectar</button>

    <h3>Log</h3>
    <div id="log"></div>

    <script>
      const logEl = document.getElementById("log");
      function log(msg) {
        const ts = new Date().toLocaleTimeString();
        logEl.textContent += `[${ts}] ${msg}\n`;
        logEl.scrollTop = logEl.scrollHeight;
      }

      function tratarErroSerial(error) {
        if (!error) return "Erro desconhecido";

        if (error.name === "NotFoundError") {
          return "Nenhuma porta serial encontrada ou porta recusada pelo usuário.";
        }
        if (error.name === "NetworkError") {
          return "Falha ao abrir a porta serial (porta pode estar em uso por outro aplicativo).";
        }
        if (error.name === "SecurityError") {
          return "Permissão negada para acessar a porta serial.";
        }
        if (error.name === "InvalidStateError") {
          return "A porta já está aberta ou em estado inválido.";
        }
        if (
          error.message &&
          error.message.includes("Failed to open serial port")
        ) {
          return "Falha ao abrir a porta serial: verifique se ela está disponível e sem uso.";
        }
        return `Erro inesperado: ${error.message || error.name || error}`;
      }

      let port = null;
      let reader = null;
      let inputDone = null;
      let outputStream = null;

      async function readLoop() {
        while (true) {
          try {
            const { value, done } = await reader.read();
            if (done) {
              log("Leitura finalizada.");
              break;
            }
            if (value) {
              log("RX: " + value);
            }
          } catch (error) {
            log("Erro na leitura: " + tratarErroSerial(error));
            break;
          }
        }
      }

      document
        .getElementById("connectBtn")
        .addEventListener("click", async () => {
          if (!("serial" in navigator)) {
            log("Web Serial API não suportada neste navegador.");
            return;
          }

          try {
            port = await navigator.serial.requestPort();
            const baudRate =
              parseInt(document.getElementById("baudRate").value, 10) || 115200;
            await port.open({ baudRate });

            log("Porta aberta com baud rate " + baudRate);

            const decoder = new TextDecoderStream();
            inputDone = port.readable.pipeTo(decoder.writable);
            const inputStream = decoder.readable;
            reader = inputStream.getReader();

            readLoop();

            const encoder = new TextEncoderStream();
            outputStream = encoder.writable;
            outputStream.pipeTo(port.writable);

            document.getElementById("sendBtn").disabled = false;
            document.getElementById("disconnectBtn").disabled = false;
            document.getElementById("connectBtn").disabled = true;
          } catch (error) {
            log("Erro ao abrir a porta: " + tratarErroSerial(error));
          }
        });

      document.getElementById("sendBtn").addEventListener("click", async () => {
        if (!port || !port.writable) {
          log("Porta não está aberta.");
          return;
        }

        const payload = document.getElementById("payload").value;
        const type = document.getElementById("payloadType").value;

        try {
          const writer = port.writable.getWriter();

          if (type === "hex") {
            // Remove espaços e converte hex para bytes
            const hexString = payload.replace(/[^0-9a-fA-F]/g, "");
            if (hexString.length % 2 !== 0) {
              log("Payload hex inválido, comprimento ímpar.");
              writer.releaseLock();
              return;
            }
            const bytes = new Uint8Array(
              hexString.match(/.{1,2}/g).map((byte) => parseInt(byte, 16))
            );
            await writer.write(bytes);
            log("TX (hex): " + hexString.toUpperCase());
          } else {
            await writer.write(new TextEncoder().encode(payload));
            log("TX (text): " + payload);
          }

          writer.releaseLock();
        } catch (error) {
          log("Erro ao enviar: " + tratarErroSerial(error));
        }
      });

      document
        .getElementById("disconnectBtn")
        .addEventListener("click", async () => {
          if (reader) {
            await reader.cancel();
            await inputDone.catch(() => {});
            reader = null;
            inputDone = null;
          }
          if (port) {
            await port.close();
            log("Porta fechada.");
            port = null;
          }

          document.getElementById("sendBtn").disabled = true;
          document.getElementById("disconnectBtn").disabled = true;
          document.getElementById("connectBtn").disabled = false;
        });
    </script>
  </body>
</html>
